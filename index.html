<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperium - оставить заявку</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" class="css">
</head>
<body>
    <main>
        <div class="info-block">
            <h1>Imperium Digital</h1>
            <p>Создаем отказоустойчивые веб-системы, проектируем базы данных и превращаем сложные технические задачи в элегантный код. Оставьте заявку, и мы обсудим ваш проект</p>
        </div>
        <form>
            <div>
                <label for="username">Как вас зовут?</label>
                <input type="text" id="username" placeholder="Как вас зовут">
            </div>
            <div>
                <label for="email">Ваша электронная почта</label>
                <input type="email" id="email" placeholder="mymail@mail.ru">
            </div>
            <textarea placeholder="Расскажите о вашем проекте"></textarea>
            <button type="submit">Отправить заявку</button>
        </form>
    </main>
</body>
</html>
